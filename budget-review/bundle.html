<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>협력사업 예산 심사</title>
  <style>
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --text: #1c2430;
  --muted: #6b7480;
  --line: #e3e6ea;
  --ok: #1f7a4d;
  --ok-bg: #e6f4ec;
  --no: #b3261e;
  --no-bg: #fbe9e7;
  --accent: #2b4c7e;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  line-height: 1.5;
}

.wrap { max-width: 880px; margin: 0 auto; padding: 40px 16px 56px; }

.eyebrow { margin: 0; color: var(--accent); font-weight: 700; font-size: 14px; }
h1 { margin: 4px 0 8px; font-size: 26px; }
.rule { margin: 0 0 24px; color: var(--muted); font-size: 14px; }

.summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.label { color: var(--muted); font-size: 13px; }
.value { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }

.table-wrap {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow-x: auto;
}
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th, td { padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { background: #fafbfc; text-align: left; font-size: 13px; color: var(--muted); font-weight: 600; }
tbody tr:last-child td { border-bottom: none; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.center { text-align: center; }
.muted { color: var(--muted); }

.ok { color: var(--ok); }
.no { color: var(--no); }
.badge {
  display: inline-block;
  padding: 2px 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
}
.badge.ok { background: var(--ok-bg); }
.badge.no { background: var(--no-bg); }
tr.rejected td:first-child { box-shadow: inset 3px 0 0 var(--no); }

.note { color: var(--muted); font-size: 13px; margin-top: 12px; }

@media (max-width: 560px) {
  .summary { grid-template-columns: 1fr; }
  h1 { font-size: 22px; }
}
</style>
</head>
<body>
  <main class="wrap">
    <header>
      <p class="eyebrow">자치행정 협력사업</p>
      <h1>지자체 신청 예산 자동 심사</h1>
      <p class="rule">심사 규칙: 한도액 = 인구수 × 10 · 신청액 &gt; 한도액이면 <b class="no">반려</b>, 같거나 작으면 <b class="ok">승인</b></p>
    </header>

    <section class="summary" aria-label="심사 요약">
      <div class="card">
        <span class="label">승인 건수</span>
        <span class="value ok" id="approvedCount">-</span>
      </div>
      <div class="card">
        <span class="label">반려 건수</span>
        <span class="value no" id="rejectedCount">-</span>
      </div>
      <div class="card">
        <span class="label">승인 신청액 합계</span>
        <span class="value" id="approvedSum">-</span>
      </div>
    </section>

    <section class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>지자체명</th>
            <th class="num">인구수</th>
            <th class="num">신청액</th>
            <th class="num">한도액</th>
            <th class="center">판정</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="5" class="center muted">신청목록을 불러오는 중…</td></tr>
        </tbody>
      </table>
    </section>
    <p class="note" id="status"></p>
  </main>
  <script>
// 심사 규칙: 한도액 = 인구수 × 10, 신청액 > 한도액 → 반려, 그 외 → 승인
// 같은 폴더의 JSON을 먼저 읽고, 없으면 GitHub 원본을 읽는다
const DATA_SOURCES = [
  "신청목록.json",
  "https://raw.githubusercontent.com/xkanghj/AI-champion/main/budget-review/%EC%8B%A0%EC%B2%AD%EB%AA%A9%EB%A1%9D.json",
];
const fmt = (n) => n.toLocaleString("ko-KR");

function judge(item) {
  const limit = item["인구수"] * 10;
  const result = item["신청액"] > limit ? "반려" : "승인";
  return { ...item, 한도액: limit, 판정: result };
}

function render(rows) {
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = rows
    .map((r) => {
      const ok = r.판정 === "승인";
      return `<tr class="${ok ? "" : "rejected"}">
        <td>${r["지자체명"]}</td>
        <td class="num">${fmt(r["인구수"])}</td>
        <td class="num">${fmt(r["신청액"])}</td>
        <td class="num">${fmt(r.한도액)}</td>
        <td class="center"><span class="badge ${ok ? "ok" : "no"}">${r.판정}</span></td>
      </tr>`;
    })
    .join("");

  const approved = rows.filter((r) => r.판정 === "승인");
  const approvedSum = approved.reduce((s, r) => s + r["신청액"], 0);
  document.getElementById("approvedCount").textContent = `${approved.length}건`;
  document.getElementById("rejectedCount").textContent = `${rows.length - approved.length}건`;
  document.getElementById("approvedSum").textContent = `${fmt(approvedSum)}원`;
  document.getElementById("status").textContent = `총 ${rows.length}건 심사 완료`;
}

async function load() {
  let lastError;
  for (const src of DATA_SOURCES) {
    try {
      const res = await fetch(src.startsWith("http") ? src : encodeURI(src));
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      render(data.map(judge));
      return;
    } catch (err) {
      lastError = err;
    }
  }
  document.getElementById("tbody").innerHTML =
    `<tr><td colspan="5" class="center no">신청목록.json을 불러오지 못했습니다 (${lastError.message})</td></tr>`;
}

document.addEventListener("DOMContentLoaded", load);
</script>
</body>
</html>
